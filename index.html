<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pursuit - by DEメTER</title>
   
       <link rel="stylesheet" href="css/style.css"> 
       
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f0c11;
            color: #a8da4c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            background-color: #131016;
            display: block;
        }
        .ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
        .energy-label {
            color: #e63946;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .energy-bar-bg {
            width: 200px;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
        }
        #energyBar {
            width: 100%;
            height: 100%;
            background: #e63946;
            transition: width 0.1s linear;
        }
        #screenOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 12, 17, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .credit-banner {
            position: absolute;
            top: 20px;
            font-size: 0.9rem;
            color: #64dfdf;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            gap: 15px;
        }
        .credit-banner a {
            color: #e63946;
            text-decoration: none;
            font-weight: bold;
            transition: text-shadow 0.3s ease;
        }
        .credit-banner a:hover {
            text-shadow: 0 0 8px rgba(230, 57, 70, 0.6);
        }
        h1 {
            color: #e63946;
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            color: #a8da4c;
            font-size: 1.2rem;
            margin-bottom: 25px;
            max-width: 450px;
            line-height: 1.5;
        }
        button {
            background: transparent;
            border: 2px solid #e63946;
            color: #e63946;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #e63946;
            color: #0f0c11;
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.5);
        }
        .instructions {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #64dfdf;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="ui-layer">
            <div class="energy-label">Emotional Energy</div>
            <div class="energy-bar-bg">
                <div id="energyBar"></div>
            </div>
        </div>

        <div id="screenOverlay">
            <div class="credit-banner">
                <span>GitHub: <a href="https://github.com" target="_blank" rel="noopener noreferrer">xdotdex</a></span>
                <span>•</span>
                <span>TG: <a href="https://t.me" target="_blank" rel="noopener noreferrer">@xdotdexter</a></span>
            </div>
            
            <h1 id="overlayTitle">THE PURSUIT</h1>
            <p id="overlayText">A game about unrequited love. Move your heart close to the target. It is designed to be intentionally difficult.</p>
            <button id="actionBtn" onclick="startGame()">Begin Journey</button>
            <div class="instructions" id="controlHint">Use MOUSE or FINGER SENSORS to steer.</div>
        </div>
    </div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const energyBar = document.getElementById('energyBar');
        const screenOverlay = document.getElementById('screenOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const actionBtn = document.getElementById('actionBtn');

        // Game Configuration
        let player = { x: 200, y: 300, size: 12, speed: 4.5 };
        let target = { x: 600, y: 300, radius: 15, baseSpeed: 2.2 };
        let mouse = { x: 200, y: 300 };
        let obstacles = [];
        let energy = 100;
        let survivalTime = 0;
        let isRunning = false;
        let isGameOver = false;

        const thoughts = [
            "Maybe if I try harder...",
            "Why are they moving away?",
            "Just a little closer...",
            "Are they ignoring me?",
            "So near, yet completely out of reach."
        ];
        let activeThought = "";
        let thoughtTimer = 0;

        function initObstacles() {
            obstacles = [];
            for (let i = 0; i < 5; i++) {
                obstacles.push({
                    x: 250 + Math.random() * 350,
                    y: 50 + Math.random() * 500,
                    radius: 15 + Math.random() * 15,
                    speed: 2 + Math.random() * 3,
                    dirY: Math.random() > 0.5 ? 1 : -1
                });
            }
        }

        // Fixed Input tracking validation
        function updateInput(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches && e.touches.length > 0) {
                mouse.x = e.touches[0].clientX - rect.left;
                mouse.y = e.touches[0].clientY - rect.top;
            } else if (e.clientX !== undefined) {
                mouse.x = e.clientX - rect.left;
                mouse.y = e.clientY - rect.top;
            }
        }

        window.addEventListener('mousemove', updateInput);
        window.addEventListener('touchmove', updateInput, { passive: true });
        window.addEventListener('touchstart', updateInput, { passive: true });

        function drawHeart(x, y, size) {
            ctx.fillStyle = '#e63946';
            ctx.beginPath();
            ctx.arc(x - size/2, y - size/2, size, 0, Math.PI * 2);
            ctx.arc(x + size/2, y - size/2, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x - size, y - size/3);
            ctx.lineTo(x + size, y - size/3);
            ctx.lineTo(x, y + size * 1.2);
            ctx.closePath();
            ctx.fill();
        }

        function startGame() {
            energy = 100;
            survivalTime = 0;
            player.x = 200;
            player.y = 300;
            target.x = 600;
            target.y = 300;
            mouse.x = 200;
            mouse.y = 300;
            activeThought = "";
            thoughtTimer = 0;
            initObstacles();
            
            isGameOver = false;
            isRunning = true;
            screenOverlay.style.display = 'none';
            loop();
        }

        function triggerGameOver(reason) {
            isRunning = false;
            isGameOver = true;
            screenOverlay.style.display = 'flex';
            overlayTitle.innerText = "GAME OVER";
            overlayText.innerText = reason;
            actionBtn.innerText = "Try Again";
        }

        function loop() {
            if (!isRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let pDx = mouse.x - player.x;
            let pDy = mouse.y - player.y;
            let pDist = Math.hypot(pDx, pDy);
            if (pDist > 5) {
                player.x += (pDx / pDist) * player.speed;
                player.y += (pDy / pDist) * player.speed;
            }

            let tDx = target.x - player.x;
            let tDy = target.y - player.y;
            let targetDist = Math.hypot(tDx, tDy);

            let evasionMultiplier = 1.0;
            if (targetDist < 280) {
                evasionMultiplier = 1.0 + (280 - targetDist) / 32;

                if (thoughtTimer <= 0) {
                    activeThought = thoughts[Math.floor(Math.random() * thoughts.length)];
                    thoughtTimer = 110; 
                }
            }

            if (targetDist > 0) {
                target.x += (tDx / targetDist) * target.baseSpeed * evasionMultiplier;
                target.y += (tDy / targetDist) * target.baseSpeed * evasionMultiplier;
            }

            target.x = Math.max(30, Math.min(canvas.width - 30, target.x));
            target.y = Math.max(30, Math.min(canvas.height - 30, target.y));

            obstacles.forEach(obs => {
                obs.y += obs.speed * obs.dirY;
                if (obs.y <= obs.radius || obs.y >= canvas.height - obs.radius) {
                    obs.dirY *= -1; 
                }

                let obsDist = Math.hypot(player.x - obs.x, player.y - obs.y);
                if (obsDist < (obs.radius + player.size)) {
